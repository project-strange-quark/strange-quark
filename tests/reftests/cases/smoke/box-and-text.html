<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smoke — Box &amp; Text</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 800px;
        height: 600px;
        background-color: #181c24;
        color: #f4f6fa;
        font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 560px;
        padding: 32px;
        background-color: #252b38;
        border: 2px solid #4c6ef5;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .banner {
        height: 64px;
        border-radius: 10px;
        background: linear-gradient(90deg, #4c6ef5 0%, #22b8cf 100%);
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #c5cedd;
      }
      .swatches {
        display: flex;
        gap: 16px;
      }
      .swatch {
        width: 96px;
        height: 48px;
        border-radius: 8px;
      }
      .swatch-red {
        background-color: #fa5252;
      }
      .swatch-green {
        background-color: #40c057;
      }
      .swatch-amber {
        background-color: #fab005;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="banner"></div>
      <h1>Strange Quark Smoke Reftest</h1>
      <p>Flexbox, border-radius, linear gradient, and sRGB color swatches.</p>
      <div class="swatches">
        <div class="swatch swatch-red"></div>
        <div class="swatch swatch-green"></div>
        <div class="swatch swatch-amber"></div>
      </div>
    </main>
  </body>
</html>
