<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>measureText drives boxes and baselines</title>
  <link rel="stylesheet" href="../_assets/r3.css">
</head>
<body>
  <canvas id="c" width="480" height="320"></canvas>
  <script>
    async function draw() {
      // A face that has not been requested is not loading, so document.fonts.ready
      // can resolve before TestSans is usable. Request both sizes this case draws.
      await document.fonts.load("24px TestSans");
      await document.fonts.load("50px TestSans");
      await document.fonts.ready;
      const ctx = document.getElementById("c").getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 480, 320);

      // Excalidraw sizes its text container from measureText.
      const lines = ["Excalidraw", "native text", "Wrapping Wg"];
      ctx.font = "24px TestSans";
      let y = 48;
      for (const line of lines) {
        const m = ctx.measureText(line);
        const width = Math.ceil(m.width);
        const ascent = Math.ceil(m.actualBoundingBoxAscent ?? 18);
        const descent = Math.ceil(m.actualBoundingBoxDescent ?? 6);
        ctx.fillStyle = "#eff6ff";
        ctx.fillRect(20, y - ascent, width + 16, ascent + descent + 8);
        ctx.strokeStyle = "#93c5fd";
        ctx.strokeRect(20, y - ascent, width + 16, ascent + descent + 8);
        ctx.fillStyle = "#0f172a";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(line, 28, y);
        y += ascent + descent + 26;
      }

      // measureText('A B').width must keep the space.
      ctx.font = "50px TestSans";
      const spaced = ctx.measureText("A B").width;
      ctx.fillStyle = "#bbf7d0";
      ctx.fillRect(20, 260, spaced, 30);
      ctx.fillStyle = "#166534";
      ctx.fillText("A B", 20, 292);
      ctx.textBaseline = "top";
      ctx.fillText(`${Math.round(spaced)}px`, 300, 268);
    }

    draw();
  </script>
</body>
</html>
