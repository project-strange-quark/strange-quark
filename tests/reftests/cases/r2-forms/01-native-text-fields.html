<!doctype html>
<meta charset="utf-8">
<title>Native single-line fields and intrinsic widths</title>
<style>
  body { margin: 12px; }
  .rows { display: grid; grid-template-columns: 190px 190px; gap: 12px 4px; }
  label { display: flex; align-items: start; }
</style>
<main class="rows">
  <label><input data-geom="text" value="Editable value"></label>
  <label><input data-geom="small" size="10" value="Short field"></label>
  <label><input data-geom="search" type="search" value="Search terms"></label>
  <label><input data-geom="password" type="password" value="secret"></label>
  <label><input data-geom="url" type="url" value="https://example.test"></label>
  <label><input data-geom="email" type="email" placeholder="Email address"></label>
  <label><input data-geom="number" type="number" value="123.5"></label>
  <label><input data-geom="tel" type="tel" value="0123 456" disabled></label>
</main>
