<!doctype html>
<meta charset="utf-8">
<title>Journal state changes affect computed control styles</title>
<style>
  body { margin: 14px; }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  input, button {
    appearance: none;
    box-sizing: border-box;
    border: 1px solid #28455e;
    border-radius: 4px;
    background: #f0f9ff;
    color: #123;
  }
  input[type=checkbox] { height: 22px; width: 22px; margin: 0; }
  input:checked { background: #068447; }
  button { width: 104px; height: 28px; }
  button:disabled { background: #fbd4d4; color: #6e1e1e; }
  input:focus { background: #fff6c8; }
  input:focus-visible { outline: 3px solid #8134ad; outline-offset: 2px; }
  .text { width: 160px; height: 28px; padding-inline: 8px; }
</style>
<div class="row">
  <input data-geom="cleared" id="cleared" type="checkbox" checked aria-label="Cleared">
  <input data-geom="set" id="set" type="checkbox" aria-label="Set">
  <button id="disabled" data-geom="disabled">Disabled</button>
</div>
<div class="row">
  <input class="text" id="focus" data-geom="focused" aria-label="Focused field">
  <input class="text" value="Unfocused" aria-label="Unfocused field">
</div>
<script>
  document.getElementById("cleared").checked = false;
  document.getElementById("set").checked = true;
  document.getElementById("disabled").disabled = true;
  document.getElementById("focus").focus();
</script>
