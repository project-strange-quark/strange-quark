<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text decoration underline, line-through, overline</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; font-size: 18px; line-height: 36px; padding: 16px; }
    .u { text-decoration: underline; text-decoration-color: #2563eb; text-decoration-thickness: 2px; }
    .s { text-decoration: line-through; text-decoration-color: #dc2626; }
    .o { text-decoration: overline; text-decoration-color: #16a34a; }
    .off { text-decoration: underline; text-underline-offset: 5px; }
  </style>
</head>
<body>
  <div class="u">Underlined blue 2px</div>
  <div class="s">Strikethrough red</div>
  <div class="o">Overline green</div>
  <div class="off">Underline offset 5px</div>
</body>
</html>
