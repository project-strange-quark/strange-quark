<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>word-break and overflow-wrap</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestMono", monospace; font-size: 14px; line-height: 20px; padding: 14px; }
    .box { width: 120px; border: 1px solid #64748b; padding: 6px; margin-bottom: 12px; background: #f8fafc; }
    .ba { word-break: break-all; }
    .bw { overflow-wrap: break-word; }
  </style>
</head>
<body>
  <div class="box ba">supercalifragilisticexpialidocious</div>
  <div class="box bw">short supercalifragilistic word</div>
</body>
</html>
