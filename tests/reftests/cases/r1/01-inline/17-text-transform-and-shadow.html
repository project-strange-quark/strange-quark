<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>text-transform and text-shadow</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; font-size: 20px; line-height: 34px; padding: 16px; }
    .up { text-transform: uppercase; }
    .lo { text-transform: lowercase; }
    .cap { text-transform: capitalize; }
    .sh { font-weight: 700; color: #1e293b; text-shadow: 2px 3px 4px rgba(37, 99, 235, 0.55); }
  </style>
</head>
<body>
  <div class="up">uppercase transform</div>
  <div class="lo">LOWERCASE TRANSFORM</div>
  <div class="cap">capitalize each word</div>
  <div class="sh">Text with soft blue shadow</div>
</body>
</html>
