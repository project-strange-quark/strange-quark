<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>position: absolute resolves against nearest positioned ancestor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .outer { position: relative; width: 300px; height: 200px; margin: 24px; background: #e2e8f0; padding: 24px; border: 4px solid #334155; }
    .static { width: 180px; height: 120px; background: #cbd5e1; }
    .abs { position: absolute; right: 12px; bottom: 12px; width: 72px; height: 48px; background: #ef4444; }
  </style>
</head>
<body>
  <div class="outer"><div class="static"><div class="abs"></div></div></div>
</body>
</html>
