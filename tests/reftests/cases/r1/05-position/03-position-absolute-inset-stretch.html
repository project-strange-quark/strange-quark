<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>position: absolute inset shorthand stretching</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .cb { position: relative; width: 300px; height: 200px; margin: 24px; background: #1e293b; }
    .a { position: absolute; inset: 16px; background: #38bdf8; }
    .b { position: absolute; inset: 32px 48px 24px 20px; background: #fbbf24; }
  </style>
</head>
<body>
  <div class="cb"><div class="a"></div><div class="b"></div></div>
</body>
</html>
