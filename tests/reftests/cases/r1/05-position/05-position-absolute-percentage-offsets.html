<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Absolute percentage top/left/width/height</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .cb { position: relative; width: 300px; height: 200px; margin: 24px; background: #e2e8f0; }
    .p { position: absolute; left: 25%; top: 20%; width: 50%; height: 60%; background: #10b981; }
  </style>
</head>
<body>
  <div class="cb"><div class="p"></div></div>
</body>
</html>
