<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Static form controls styled with appearance: none</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .btn { appearance: none; width: 160px; height: 38px; border: 1px solid #4f46e5; border-radius: 8px; background: #6366f1; color: #ffffff; font: 700 14px/1 "TestSans", sans-serif; }
    .inp { appearance: none; width: 240px; height: 36px; padding: 0 10px; border: 1px solid #94a3b8; border-radius: 6px; background: #ffffff; color: #0f172a; font: 400 14px/1 "TestSans", sans-serif; }
    .chk { appearance: none; width: 20px; height: 20px; border: 2px solid #4f46e5; border-radius: 4px; background: #6366f1; margin: 0; }
  </style>
</head>
<body>
  <button class="btn" type="button">Primary Action</button>
  <input class="inp" type="text" value="Editable value">
  <input class="chk" type="checkbox" checked>
</body>
</html>
