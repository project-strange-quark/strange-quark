<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@font-face unicode-range subsets of one family</title>
  <style>
    /* @fontsource's pattern: one face per unicode-range subset of a family. */
    @font-face {
      font-family: "Subset";
      src: url("../_assets/fonts/LiberationSans-Regular.woff2") format("woff2");
      unicode-range: U+0000-002F, U+003A-00FF;
    }
    @font-face {
      font-family: "Subset";
      src: url("../_assets/fonts/LiberationMono-Regular.woff2") format("woff2");
      unicode-range: U+0030-0039;
    }
    /* Defined last, so it wins the capitals the first face also covers. */
    @font-face {
      font-family: "Subset";
      src: url("../_assets/fonts/LiberationSans-Bold.woff2") format("woff2");
      unicode-range: U+0041-005A;
    }
    /* The bold faces split the same characters differently. */
    @font-face {
      font-family: "Subset";
      src: url("../_assets/fonts/LiberationSans-Italic.woff2") format("woff2");
      font-weight: 700;
      unicode-range: U+0000-00FF;
    }
    @font-face {
      font-family: "Fallback";
      src: url("../_assets/fonts/LiberationMono-Regular.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { padding: 12px 16px; font: 20px/28px "Subset", "Fallback", monospace; }
    p { margin: 0 0 6px 0; }
    .bold { font-weight: 700; }
  </style>
</head>
<body>
  <p>Mixed Subsets 0123456789</p>
  <p>lower UPPER 42 digits</p>
  <p>Cyrillic Жук outside every range</p>
  <p class="bold">Bold 700 ABC 123 xyz</p>
</body>
</html>
