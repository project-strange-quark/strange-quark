<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title><img> intrinsic size, width-only aspect scaling, and explicit size</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 16px; align-items: flex-start; padding: 20px; }
    img { border: 2px solid #334155; display: block; }
    .w128 { width: 128px; height: auto; }
    .fixed { width: 100px; height: 100px; }
  </style>
</head>
<body>
  <img src="../_assets/images/photo-64x48.png" alt="intrinsic">
  <img class="w128" src="../_assets/images/photo-64x48.png" alt="scaled">
  <img class="fixed" src="../_assets/images/photo-64x48.png" alt="fixed">
</body>
</html>
