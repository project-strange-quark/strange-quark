<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Standards mode root html/body full-height layout</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f1f5f9; }
    .card { width: 200px; height: 100px; background: #6965db; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="root"><div class="card"></div></div>
</body>
