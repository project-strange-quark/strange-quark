<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Excalidraw .visually-hidden with legacy clip: rect(1px,1px,1px,1px)</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; font-size: 16px; padding: 20px; }
    .visually-hidden {
      position: absolute !important;
      height: 1px;
      width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
      user-select: none;
    }
    .visible { padding: 12px 16px; background: #ede9fe; border: 2px solid #6965db; border-radius: 8px; }
  </style>
</head>
<body>
  <h1 class="visually-hidden">Excalidraw Screen Reader Heading</h1><div class="visible">Only this box should be visible.</div>
</body>
</html>
