<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Excalidraw dark mode invert(93%) hue-rotate(180deg) scene inversion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { background: #121212; padding: 20px; }
    .scene { width: 360px; height: 260px; background: #ffffff; filter: invert(93%) hue-rotate(180deg); position: relative; border-radius: 8px; overflow: hidden; }
    .rect { position: absolute; left: 28px; top: 32px; width: 130px; height: 90px; border: 3px solid #1e1e1e; background: #ffc9c9; border-radius: 8px; }
    .circle { position: absolute; left: 196px; top: 44px; width: 110px; height: 110px; border: 3px solid #1971c2; background: #a5d8ff; border-radius: 50%; }
    .note { position: absolute; left: 48px; top: 164px; width: 220px; height: 56px; border: 3px solid #2f9e44; background: #b2f2bb; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="scene"><div class="rect"></div><div class="circle"></div><div class="note"></div></div>
</body>
</html>
