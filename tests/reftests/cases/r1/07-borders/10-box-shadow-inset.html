<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inset box-shadow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 24px; padding: 36px; }
    .a { width: 140px; height: 110px; background: #e2e8f0; border-radius: 12px; box-shadow: inset 6px 6px 14px rgba(15, 23, 42, 0.35); }
    .b { width: 140px; height: 110px; background: #fef9c3; border-radius: 8px; box-shadow: inset 0 0 0 5px #ca8a04; }
  </style>
</head>
<body>
  <div class="a"></div><div class="b"></div>
</body>
</html>
