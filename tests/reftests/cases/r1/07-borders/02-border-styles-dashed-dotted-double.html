<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Border styles: solid, dashed, dotted, double</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: grid; grid-template-columns: 160px 160px; gap: 18px; padding: 24px; }
    div { height: 96px; background: #f8fafc; }
    .s { border: 6px solid #1e293b; }
    .da { border: 6px dashed #2563eb; }
    .do { border: 6px dotted #16a34a; }
    .db { border: 9px double #dc2626; }
  </style>
</head>
<body>
  <div class="s"></div><div class="da"></div><div class="do"></div><div class="db"></div>
</body>
</html>
