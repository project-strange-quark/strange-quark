<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>outline with outline-offset and border-radius</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 36px; padding: 40px; }
    .a { width: 110px; height: 90px; background: #dbeafe; border: 2px solid #2563eb; outline: 3px solid #ef4444; outline-offset: 6px; border-radius: 10px; }
    .b { width: 110px; height: 90px; background: #dcfce7; border: 2px solid #16a34a; outline: 4px solid #0f172a; outline-offset: -8px; }
  </style>
</head>
<body>
  <div class="a"></div><div class="b"></div>
</body>
</html>
