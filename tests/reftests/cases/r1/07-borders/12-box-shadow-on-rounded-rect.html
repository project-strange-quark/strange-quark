<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Outset and inset shadows on pill and circle shapes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 36px; align-items: center; padding: 44px; background: #f1f5f9; }
    .c { width: 100px; height: 100px; border-radius: 50%; background: #ffffff; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); }
    .p { width: 150px; height: 56px; border-radius: 999px; background: #6366f1; box-shadow: 0 6px 14px rgba(99, 102, 241, 0.45), inset 0 -4px 6px rgba(0, 0, 0, 0.2); }
  </style>
</head>
<body>
  <div class="c"></div><div class="p"></div>
</body>
</html>
