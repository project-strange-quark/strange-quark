<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>border-radius clips background gradient cleanly</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .card { width: 260px; height: 160px; margin: 32px auto; border-radius: 32px; border: 4px solid #0f172a; background: linear-gradient(135deg, #38bdf8, #818cf8); }
  </style>
</head>
<body>
  <div class="card"></div>
</body>
