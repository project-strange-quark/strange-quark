<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Multiple layered backgrounds composited in CSS order</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .box {
      width: 320px;
      height: 200px;
      margin: 24px;
      border: 2px solid #334155;
      background-image:
        linear-gradient(135deg, rgba(239, 68, 68, 0.55) 0%, transparent 55%),
        linear-gradient(225deg, rgba(37, 99, 235, 0.55) 0%, transparent 55%);
      background-color: #fef9c3;
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
