<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Multi-stop and angled linear gradients</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { padding: 20px; }
    .a { width: 340px; height: 96px; margin-bottom: 16px; background: linear-gradient(90deg, #ef4444 0%, #f59e0b 25%, #10b981 50%, #3b82f6 75%, #8b5cf6 100%); }
    .b { width: 340px; height: 110px; background: linear-gradient(135deg, #0f172a 0%, #0f172a 35%, #38bdf8 35%, #38bdf8 65%, #f43f5e 65%); }
  </style>
</head>
<body>
  <div class="a"></div><div class="b"></div>
