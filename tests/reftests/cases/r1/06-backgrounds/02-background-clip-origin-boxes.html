<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>background-clip border-box, padding-box, content-box</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 16px; padding: 20px; }
    .b { width: 104px; height: 104px; padding: 14px; border: 10px dashed #1e293b; background-color: #38bdf8; }
    .bb { background-clip: border-box; }
    .pb { background-clip: padding-box; }
    .cb { background-clip: content-box; }
  </style>
</head>
<body>
  <div class="b bb"></div><div class="b pb"></div><div class="b cb"></div>
</body>
</html>
