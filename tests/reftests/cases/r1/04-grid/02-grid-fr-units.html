<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grid fractional fr tracks</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .g { display: grid; grid-template-columns: 1fr 2fr 1fr; grid-template-rows: 1fr 2fr; gap: 10px; width: 360px; height: 220px; padding: 12px; margin: 16px; background: #e2e8f0; }
    .g > div { background: #6366f1; }
    .g > div:nth-child(2n) { background: #ec4899; }
  </style>
</head>
<body>
  <div class="g"><div></div><div></div><div></div><div></div><div></div><div></div></div>
</body>
</html>
