<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Explicit grid-column and grid-row spans</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .g { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 56px); gap: 8px; width: 340px; padding: 12px; margin: 16px; background: #e2e8f0; }
    .a { grid-column: 1 / 3; grid-row: 1 / 2; background: #ef4444; }
    .b { grid-column: 3 / span 2; grid-row: 1 / span 2; background: #3b82f6; }
    .c { grid-column: 1 / 2; grid-row: 2 / 4; background: #10b981; }
    .d { grid-column: 2 / 5; grid-row: 3 / 4; background: #f59e0b; }
  </style>
</head>
<body>
  <div class="g"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
</body>
</html>
