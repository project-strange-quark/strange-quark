<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grid justify-self, align-self, and auto margins</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .g { display: grid; grid-template-columns: 140px 140px; grid-template-rows: 90px 90px; gap: 10px; padding: 12px; margin: 16px; background: #e2e8f0; width: fit-content; }
    .a { width: 50px; height: 36px; justify-self: start; align-self: start; background: #ef4444; }
    .b { width: 50px; height: 36px; justify-self: end; align-self: center; background: #3b82f6; }
    .c { width: 50px; height: 36px; margin: auto; background: #10b981; }
    .d { justify-self: stretch; align-self: end; height: 30px; background: #f59e0b; }
  </style>
</head>
<body>
  <div class="g"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
</body>
</html>
