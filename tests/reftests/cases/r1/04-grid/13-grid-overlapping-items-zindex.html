<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overlapping grid items with z-index</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .g { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 60px); padding: 16px; margin: 16px; background: #f8fafc; width: fit-content; }
    .a { grid-column: 1 / 3; grid-row: 1 / 3; background: #3b82f6; z-index: 2; }
    .b { grid-column: 2 / 4; grid-row: 2 / 4; background: #f97316; z-index: 1; }
  </style>
</head>
<body>
  <div class="g"><div class="a"></div><div class="b"></div></div>
</body>
</html>
