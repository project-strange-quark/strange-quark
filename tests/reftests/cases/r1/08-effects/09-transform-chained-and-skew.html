<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chained transforms and skew</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 40px; padding: 52px; }
    .a { width: 100px; height: 70px; background: #6366f1; transform: translateX(16px) rotate(-15deg) scale(1.1); }
    .b { width: 100px; height: 70px; background: #ec4899; transform: skewX(-18deg); }
  </style>
</head>
<body>
  <div class="a"></div><div class="b"></div>
</body>
</html>
