<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Group opacity over overlapping children differs from per-child opacity</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 28px; padding: 28px; }
    .grp { position: relative; width: 150px; height: 150px; opacity: 0.5; }
    .ind { position: relative; width: 150px; height: 150px; }
    .r { position: absolute; left: 0; top: 0; width: 100px; height: 100px; background: #ef4444; }
    .b { position: absolute; left: 45px; top: 45px; width: 100px; height: 100px; background: #2563eb; }
    .ind .r, .ind .b { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="grp"><div class="r"></div><div class="b"></div></div><div class="ind"><div class="r"></div><div class="b"></div></div>
</body>
</html>
