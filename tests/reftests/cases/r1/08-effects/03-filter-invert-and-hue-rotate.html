<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CSS filter: invert() and hue-rotate() (Excalidraw dark mode)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 16px; padding: 20px; background: #e2e8f0; }
    .panel { width: 168px; padding: 12px; background: #ffffff; border: 2px solid #1e293b; border-radius: 8px; }
    .dark { filter: invert(93%) hue-rotate(180deg); }
    .sw { display: flex; gap: 8px; margin-bottom: 10px; }
    .sw > div { width: 32px; height: 32px; border-radius: 4px; }
    .s1 { background: #e03131; }
    .s2 { background: #2f9e44; }
    .s3 { background: #1971c2; }
    .s4 { background: #f08c00; }
    .bar { height: 24px; background: #1e1e1e; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="panel"><div class="sw"><div class="s1"></div><div class="s2"></div><div class="s3"></div><div class="s4"></div></div><div class="bar"></div></div>
  <div class="panel dark"><div class="sw"><div class="s1"></div><div class="s2"></div><div class="s3"></div><div class="s4"></div></div><div class="bar"></div></div>
</body>
</html>
