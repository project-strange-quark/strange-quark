<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>visibility: hidden hides parent while allowing visible descendant</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { padding: 24px; display: flex; gap: 16px; }
    .a { width: 100px; height: 100px; background: #3b82f6; }
    .hid { width: 120px; height: 100px; padding: 20px; background: #ef4444; visibility: hidden; }
    .vis { width: 60px; height: 60px; background: #10b981; visibility: visible; }
    .c { width: 100px; height: 100px; background: #f59e0b; }
  </style>
</head>
<body>
  <div class="a"></div><div class="hid"><div class="vis"></div></div><div class="c"></div>
</body>
</html>
