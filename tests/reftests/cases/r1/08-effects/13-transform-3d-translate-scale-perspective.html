<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D transform with perspective and rotateY</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 28px; padding: 48px; }
    .scene { perspective: 400px; }
    .card { width: 120px; height: 120px; background: linear-gradient(135deg, #0ea5e9, #6366f1); border: 4px solid #1e1b4b; transform: rotateY(30deg); }
    .t3d { width: 120px; height: 120px; background: #10b981; transform: translate3d(12px, 16px, 0); }
  </style>
</head>
<body>
  <div class="scene"><div class="card"></div></div><div class="t3d"></div>
</body>
</html>
