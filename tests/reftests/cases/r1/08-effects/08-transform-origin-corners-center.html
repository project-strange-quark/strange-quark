<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>transform-origin top left vs center vs bottom right</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { display: flex; gap: 36px; padding: 48px; }
    .slot { width: 80px; height: 80px; border: 1px dashed #94a3b8; }
    .b { width: 80px; height: 80px; background: rgba(37, 99, 235, 0.75); transform: rotate(20deg); }
    .tl { transform-origin: top left; }
    .cc { transform-origin: center center; }
    .br { transform-origin: bottom right; }
  </style>
</head>
<body>
  <div class="slot"><div class="b tl"></div></div><div class="slot"><div class="b cc"></div></div><div class="slot"><div class="b br"></div></div>
</body>
</html>
