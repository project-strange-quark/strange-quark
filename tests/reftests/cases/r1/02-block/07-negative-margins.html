<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Negative vertical and horizontal margins</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .box { width: 220px; margin: 32px auto; padding: 20px; background: #e2e8f0; border: 2px solid #475569; }
    .a { height: 60px; background: #38bdf8; }
    .b { height: 50px; margin-top: -20px; margin-left: -12px; margin-right: -12px; background: rgba(239, 68, 68, 0.8); }
  </style>
</head>
<body>
  <div class="box">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
