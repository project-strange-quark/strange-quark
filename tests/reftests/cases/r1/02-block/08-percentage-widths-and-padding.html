<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Percentage width and percentage padding relative to containing width</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .outer { width: 320px; margin: 20px; border: 2px solid #334155; background: #f8fafc; }
    .inner { width: 50%; padding: 10%; background: #a7f3d0; border: 2px solid #059669; }
    .core { height: 40px; background: #047857; }
  </style>
</head>
<body>
  <div class="outer"><div class="inner"><div class="core"></div></div></div>
</body>
</html>
