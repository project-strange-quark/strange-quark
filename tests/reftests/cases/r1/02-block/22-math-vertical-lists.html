<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Math vertical lists built from inline tables</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <!-- The technique KaTeX uses to stack math: a vertical list is an
       inline table whose first row holds the part above the baseline and
       whose second row the part below. Each item is a zero-height block
       moved up by `top`, with a clipped strut that puts the item's
       baseline a known distance below that block. -->
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; font-size: 16px; line-height: 24px; padding: 12px; }
    p { margin: 0 0 14px; }
    .math { font-size: 1.5em; line-height: 1.2; white-space: nowrap; }
    .base { display: inline-block; position: relative; white-space: nowrap; width: min-content; }
    .strut { display: inline-block; }
    .vlist-t { display: inline-table; table-layout: fixed; border-collapse: collapse; }
    .vlist-r { display: table-row; }
    .vlist { display: table-cell; vertical-align: bottom; position: relative; }
    .vlist > span { display: block; height: 0; position: relative; }
    .vlist > span > span { display: inline-block; }
    .vlist > span > .pstrut { overflow: hidden; width: 0; }
    .vlist-t2 { margin-right: -2px; }
    .vlist-s { display: table-cell; vertical-align: bottom; font-size: 1px; width: 2px; min-width: 2px; }
    .script { font-size: 0.7em; }
    .center > .vlist-t { text-align: center; }
    .frac-line { display: inline-block; width: 100%; border-bottom: 0.04em solid; min-height: 1px; }
    .accent-body { position: relative; width: 0; }
    .space { display: inline-block; }
    .hide-tail { overflow: hidden; position: relative; width: 100%; }
    .radical { display: block; border-top: 0.06em solid; margin-left: 0.6em; height: 1.1em; }
    .col { display: inline-block; }
    .colsep { display: inline-block; width: 0.5em; }
    .paren { font-size: 1.6em; }
  </style>
</head>
<body>
  <!-- A superscript, and a subscript with a superscript. -->
  <p>Inline <span class="math"><span class="base"><span class="strut" style="height:0.91em;vertical-align:-0.0833em"></span>e<span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8247em"><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="script">iπ</span></span></span></span></span><span class="space" style="margin-right:0.2222em"></span>+<span class="space" style="margin-right:0.2222em"></span>1</span></span>
     and <span class="math"><span class="base"><span class="strut" style="height:1.0728em;vertical-align:-0.2587em"></span>x<span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8141em"><span style="top:-2.4413em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="script">i</span></span><span style="top:-3.063em;margin-right:0.05em"><span class="pstrut" style="height:2.7em"></span><span class="script">2</span></span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.2587em"><span></span></span></span></span></span></span> text.</p>
  <!-- An accent moved left by a relative offset. -->
  <p>Accent <span class="math"><span class="base"><span class="strut" style="height:0.9em"></span><span class="center"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.9em"><span style="top:-3em"><span class="pstrut" style="height:3em"></span>x</span><span style="top:-3.25em"><span class="pstrut" style="height:3em"></span><span class="accent-body" style="left:-0.15em">^</span></span></span></span></span></span></span></span> text.</p>
  <!-- A fraction: numerator, rule and denominator in one list. -->
  <p>Fraction <span class="math"><span class="base"><span class="strut" style="height:2.1em;vertical-align:-0.686em"></span><span class="center"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.4em"><span style="top:-2.314em"><span class="pstrut" style="height:3em"></span>2</span><span style="top:-3.23em"><span class="pstrut" style="height:3em"></span><span class="frac-line"></span></span><span style="top:-3.677em"><span class="pstrut" style="height:3em"></span>n(n+1)</span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em"><span></span></span></span></span></span></span></span> text.</p>
  <!-- Limits above and below a big operator. -->
  <p>Sum <span class="math"><span class="base"><span class="strut" style="height:2.4em;vertical-align:-0.9em"></span><span class="center"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.5em"><span style="top:-1.9em;margin-left:0em"><span class="pstrut" style="height:3.05em"></span><span class="script">k=1</span></span><span style="top:-3.05em"><span class="pstrut" style="height:3.05em"></span><span style="font-size:1.6em">Σ</span></span><span style="top:-4.3em;margin-left:0em"><span class="pstrut" style="height:3.05em"></span><span class="script">n</span></span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.9em"><span></span></span></span></span></span><span class="space" style="margin-right:0.1667em"></span>k</span></span> text.</p>
  <!-- A matrix: columns are lists, separated by spacers. -->
  <p>Matrix <span class="math"><span class="base"><span class="strut" style="height:2.4em;vertical-align:-0.95em"></span><span class="paren">(</span><span class="col center"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.45em"><span style="top:-3.61em"><span class="pstrut" style="height:3em"></span>a</span><span style="top:-2.41em"><span class="pstrut" style="height:3em"></span>c</span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.95em"><span></span></span></span></span></span><span class="colsep"></span><span class="col center"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.45em"><span style="top:-3.61em"><span class="pstrut" style="height:3em"></span>b</span><span style="top:-2.41em"><span class="pstrut" style="height:3em"></span>d</span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.95em"><span></span></span></span></span></span><span class="paren">)</span></span></span> text.</p>
  <!-- A root: the radicand and a clipped rule above it. -->
  <p>Root <span class="math"><span class="base"><span class="strut" style="height:1.1em;vertical-align:-0.2em"></span>√<span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.9em"><span style="top:-3em"><span class="pstrut" style="height:3em"></span>x+y</span><span style="top:-3.86em"><span class="pstrut" style="height:3em"></span><span class="hide-tail" style="height:1.1em"><span class="radical" style="margin-left:0"></span></span></span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.2em"><span></span></span></span></span></span></span> text.</p>
</body>
</html>
