<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Parent padding and border prevent margin collapse</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .pad { width: 220px; margin: 16px; padding-top: 1px; background: #fef08a; }
    .bdr { width: 220px; margin: 16px; border-top: 2px solid #0f172a; background: #bbf7d0; }
    .in { height: 40px; margin-top: 24px; background: #3b82f6; }
  </style>
</head>
<body>
  <div class="pad"><div class="in"></div></div>
  <div class="bdr"><div class="in"></div></div>
</body>
</html>
