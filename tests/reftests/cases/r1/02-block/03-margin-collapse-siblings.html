<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vertical margin collapsing between adjacent siblings</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .a { width: 200px; height: 50px; margin: 20px 20px 30px 20px; background: #f97316; }
    .b { width: 200px; height: 50px; margin: 20px 20px 40px 20px; background: #0ea5e9; }
    .c { width: 200px; height: 50px; margin: 10px 20px 0 20px; background: #8b5cf6; }
  </style>
</head>
<body>
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
</body>
</html>
