<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basic block stacking with padding and borders</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { padding: 16px; }
    .a { width: 200px; height: 50px; background: #ef4444; margin-bottom: 12px; }
    .b { width: 260px; height: 60px; background: #3b82f6; padding: 10px; border: 4px solid #1e3a8a; }
    .c { height: 24px; background: #fde047; }
  </style>
</head>
<body>
  <div class="a"></div>
  <div class="b"><div class="c"></div></div>
</body>
</html>
