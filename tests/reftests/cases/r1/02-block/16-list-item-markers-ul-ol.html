<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unordered and ordered list markers</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; font-size: 15px; line-height: 22px; padding: 16px; }
    ul, ol { margin: 0 0 12px 0; padding-left: 28px; }
    .none { list-style: none; padding-left: 0; }
  </style>
</head>
<body>
  <ul><li>First bullet</li><li>Second bullet</li></ul>
  <ol><li>First number</li><li>Second number</li></ol>
  <ul class="none"><li>No marker item</li></ul>
</body>
</html>
