<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aspect-ratio items inside flex row</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .row { display: flex; align-items: stretch; gap: 12px; height: 96px; padding: 12px; margin: 20px; background: #f1f5f9; }
    .sq { aspect-ratio: 1 / 1; background: #10b981; }
    .wide { aspect-ratio: 2 / 1; background: #3b82f6; }
  </style>
</head>
<body>
  <div class="row"><div class="sq"></div><div class="wide"></div></div>
</body>
</html>
