<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flex child with min-width: 0 allowing ellipsis truncation</title>
  <link rel="stylesheet" href="../_assets/r1.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    body { font-family: "TestSans", sans-serif; font-size: 15px; padding: 16px; }
    .row { display: flex; align-items: center; gap: 8px; width: 240px; padding: 8px; border: 2px solid #334155; background: #f8fafc; }
    .icon { flex: 0 0 28px; height: 28px; background: #2563eb; border-radius: 4px; }
    .label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="row"><div class="icon"></div><div class="label">Very long sidebar filename that must truncate cleanly</div></div>
</body>
</html>
