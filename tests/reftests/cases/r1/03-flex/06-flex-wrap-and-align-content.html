<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>flex-wrap: wrap with align-content: space-between</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .box { display: flex; flex-wrap: wrap; align-content: space-between; gap: 10px; width: 260px; height: 220px; padding: 12px; margin: 20px; background: #f1f5f9; border: 2px solid #475569; }
    .item { width: 70px; height: 48px; background: #6366f1; }
    .alt { background: #ec4899; }
  </style>
</head>
<body>
  <div class="box"><div class="item"></div><div class="item alt"></div><div class="item"></div><div class="item alt"></div><div class="item"></div></div>
</body>
</html>
