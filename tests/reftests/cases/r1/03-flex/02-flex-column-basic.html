<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basic flex column layout</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .col { display: flex; flex-direction: column; width: 220px; height: 240px; padding: 12px; margin: 16px; background: #f1f5f9; }
    .a { height: 48px; background: #6366f1; }
    .b { flex: 1; background: #a5b4fc; }
    .c { height: 36px; background: #312e81; }
  </style>
</head>
<body>
  <div class="col"><div class="a"></div><div class="b"></div><div class="c"></div></div>
</body>
</html>
