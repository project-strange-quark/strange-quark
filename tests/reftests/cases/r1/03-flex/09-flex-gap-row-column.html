<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flex row-gap and column-gap with wrapping</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
    .box { display: flex; flex-wrap: wrap; row-gap: 24px; column-gap: 12px; width: 260px; padding: 12px; margin: 20px; background: #e2e8f0; }
    .i { width: 70px; height: 44px; background: #0284c7; }
  </style>
</head>
<body>
  <div class="box"><div class="i"></div><div class="i"></div><div class="i"></div><div class="i"></div><div class="i"></div></div>
</body>
</html>
