# SPDX-License-Identifier: MIT
# Workspace root.

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/stylo"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/project-strange-quark/strange-quark"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Internal crates
squark-journal = { path = "crates/squark-journal", version = "0.0.0" }
squark-types = { path = "crates/squark-types", version = "0.0.0" }

# Pins checked on crates.io on 2026-11-25. Exact pins (=) for the engines whose
# APIs churn; move one in its own commit and say why.
stylo = "=0.24.0"
stylo_traits = "=0.24.0"
arboard = { version = "=3.7.0", features = ["wayland-data-control"] }
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
mime_guess = "=2.0.5"
taffy = "=0.16.0"
parley = "=0.13.0"
fontique = "=0.13.0"
vello = "=0.12.0"
wgpu = "=30.0.2"
winit = "=0.30.13"
v8 = "=152.2.0"
html5ever = "=0.40.1"
xml5ever = "=0.40.0"

[patch.crates-io]
stylo = { path = "vendor/stylo" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Shipped binaries (`squark build` appends the pack to this runtime): no debug
# info and stripped symbols. A release build keeps line tables for profiling
# and is about three times larger.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
