# SPDX-License-Identifier: MIT
[package]
name = "squark-native"
description = "Native modules for Strange Quark apps: Rust commands and events that JavaScript calls by name"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
squark-native-macros = { version = "=0.1.0", path = "../squark-native-macros" }
squark-net = { version = "=0.1.0", path = "../squark-net" }
squark-types.workspace = true
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[lints]
workspace = true
