# SPDX-License-Identifier: MIT
[package]
name = "squark-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
color = "=0.3.3"
guillotiere = "=0.7.0"
squark-types.workspace = true
squark-canvas = { version = "=0.0.0", path = "../squark-canvas" }
bytemuck = { version = "1.25.2", features = ["derive"] }
squark-paint = { version = "=0.0.0", path = "../squark-paint" }
# Match the workspace pin with Vulkan as the only enabled backend.
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl"] }

vello = { version = "=0.12.0", default-features = false, features = ["wgpu"] }

# One native backend per platform; `native_backend()` in src/lib.rs picks the
# same one at runtime.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["dx12"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan"] }

[dev-dependencies]
pollster = "=0.4.0"
png = "=0.18.1"

[lints]
workspace = true
