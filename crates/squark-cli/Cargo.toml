# SPDX-License-Identifier: MIT
[package]
name = "squark-cli"
description = "The squark CLI: pack, inspect, build, dev, and screenshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "squark"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5"
html5ever.workspace = true
squark-journal.workspace = true
squark-types.workspace = true
markup5ever = "0.40.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tendril = "0.5"
thiserror = "2"
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
