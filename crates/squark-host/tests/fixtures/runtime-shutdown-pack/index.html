<!doctype html>
<meta charset="utf-8">
<title>Document shutdown race</title>
<style>
  body { margin: 0; }
  #layout { width: 120px; height: 80px; background: #123456; }
</style>
<canvas id="canvas" width="64" height="64"></canvas>
<div id="layout"></div>
<script>
  const canvas = document.getElementById("canvas");
  const context = canvas.getContext("2d");
  context.fillStyle = "#abcdef";
  context.fillRect(0, 0, canvas.width, canvas.height);
  const layout = document.getElementById("layout");
  window.layoutReads = 0;
  window.canvasRequests = 0;
  window.pendingCanvasRequests = 0;
  function keepBusy() {
    window.pendingCanvasRequests++;
    canvas.toBlob(() => window.pendingCanvasRequests--, "image/png");
    layout.getBoundingClientRect();
    window.canvasRequests++;
    window.layoutReads++;
    requestAnimationFrame(keepBusy);
  }
  requestAnimationFrame(keepBusy);
</script>
